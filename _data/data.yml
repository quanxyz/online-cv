experiences:
  title: Personal & Academic Projects
  info:
    time: 2026
    company: Socket File Transfer System (Capstone Project)
    details:
      - Architected a multi-threaded client-server file transmission system from scratch using raw Python TCP sockets with zero external networking libraries.
      - Authored a custom Mini-RFC binary framing protocol (5-byte fixed header, 14 opcodes, Big-Endian), completely eliminating TCP packet coalescing and fragmentation.
      - Implemented offset-based resumable transfers, constant-memory chunked streaming (1MB chunks) for multi-GB files, and dual-layer MD5 checksum verification (in-transit & on-disk).
      - Formulated a sliding-window rate limiter supporting dynamic bandwidth allocation across active clients up to a 500 MB/s server ceiling.
      - Engineered an exhaustive automated Pytest suite of **84 test cases across 13 test suites** (covering network faults, drops, race conditions, and memory leaks).
      - Collaborated with AI agents to explore protocol design alternatives; systematically audited and refined AI-generated code for security, memory safety, and boundary correctness.

    time: 2025
    company: 3D UAV Collision Avoidance & Spatial Indexing System
    details: |
      - Researched, implemented, and benchmarked real-time 3D collision avoidance for autonomous drone fleets, reducing spatial query complexity from **O(N^2)** to **O(N log N)** using recursive Octree spatial partitioning in C++ and Python.
      - Formulated physics-based avoidance mechanics with dynamic safety zones and inverse-distance repulsion vector fields.
      - Conducted extensive benchmarks on synthetic distributions and Kaggle telemetry datasets; identified the exact crossover threshold (**N = 32 drones**) where Octree outperforms brute force after amortizing tree construction.
      - Tuned optimal Octree node capacity to **6–12 agents**, maximizing spatial pruning efficiency with **zero missed collisions across 400 active drones**.
      - Built an interactive 3D visualizer using PyVista to render flight vectors, safety barriers, and real-time avoidance maneuvers.

    time: 2026
    company: Urban Traffic Simulator & Routing Engine
    details: |
      - Developed a real-time urban traffic simulator combining live OpenStreetMap vector topology with a high-performance C++17 micro-simulation engine.
      - Implemented and benchmarked **Dijkstra**, **A\***, and **BFS** shortest-path algorithms, analyzing computation latency and node expansions under varying network congestion.
      - Modeled vehicular micro-simulation behaviors including car-following logic, intersection right-of-way conflict resolution, and automated deadlock recovery.
      - Engineered a lightweight Python bridge using only standard libraries to stream engine state to a live web frontend rendered with Leaflet.js.

